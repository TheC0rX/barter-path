[project]
name = "barter-path"
version = "0.1.0"
description = "Stalcraft barter progress tracker powered by Aiogram."
authors = [
    {name = "TheC0rX",email = "therealcorx@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram (>=3.27.0,<4.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "aiogram-i18n (>=1.5,<2.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fluent-runtime (>=0.4.0,<0.5.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false